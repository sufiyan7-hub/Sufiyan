name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop & Open Firewall
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Allow RDP in Windows Firewall
          netsh advfirewall firewall add rule name="Open RDP Port 3389" dir=in action=allow protocol=TCP localport=3389

      - name: Create RDP User with Password
        run: |
          $password = "mc6qrtvstw83;+%F?"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Set-LocalUser -Name "RDP" -Password $securePass
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Show RDP Details
        run: |
          Write-Host "`n=============================="
          Write-Host "📍 IP Address: 100.84.49.76"
          Write-Host "👤 Username : RDP"
          Write-Host "🔑 Password : mc6qrtvstw83;+%F?"
          Write-Host "==============================`n"
          Write-Host "💡 Use 'mstsc' in Windows or any RDP client to connect."
          Write-Host "Press Ctrl+C to stop Runner."

      - name: Keep Runner Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] 🟢 RDP Active - Press Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
